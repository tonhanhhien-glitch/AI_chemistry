services:
  - type: web
    name: vsepr-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - { key: DATA_DIR, value: /var/data }
      - { key: ENABLE_OPENROUTER, value: "false" }
      - { key: OPENROUTER_MODEL, value: "google/gemma-4-31b-it:free" }
      - { key: OPENROUTER_API_KEY, sync: false }
      - { key: ENABLE_PUBCHEM, value: "true" }
      - { key: ENABLE_RDKIT, value: "false" }
      - { key: TEACHER_EXPORT_TOKEN, sync: false }
    disk: { name: study-data, mountPath: /var/data, sizeGB: 1 }
  - type: web
    name: vsepr-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - { key: VITE_API_BASE_URL, value: https://replace-with-backend.example/api/v1 }
