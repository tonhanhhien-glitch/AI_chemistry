services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_RDKIT: ${INSTALL_RDKIT:-false}
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://vsepr.hungntt.me,http://localhost:8080}
      DATA_DIR: /data
      CACHE_DIR: /app/app/cache
      TEACHER_EXPORT_TOKEN: ${TEACHER_EXPORT_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-QNU VSEPR Learning WebApp}
      ENABLE_OPENROUTER: ${ENABLE_OPENROUTER:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ENABLE_OPENAI: ${ENABLE_OPENAI:-false}
      ENABLE_PUBCHEM: ${ENABLE_PUBCHEM:-false}
      PUBCHEM_TIMEOUT_SECONDS: ${PUBCHEM_TIMEOUT_SECONDS:-8}
      PUBCHEM_CACHE_TTL_SECONDS: ${PUBCHEM_CACHE_TTL_SECONDS:-86400}
      PUBCHEM_MAX_REQUESTS_PER_SECOND: ${PUBCHEM_MAX_REQUESTS_PER_SECOND:-4}
      PUBCHEM_MAX_CANDIDATES: ${PUBCHEM_MAX_CANDIDATES:-20}
      PUBCHEM_RETRY_COUNT: ${PUBCHEM_RETRY_COUNT:-2}
      ENABLE_RDKIT: ${ENABLE_RDKIT:-false}
    volumes:
      - study-data:/data
    # Container-to-container only. Never published to the host, so port 8000 is
    # unreachable from the LAN and from the Internet.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Loopback-only publish: local testing works, the LAN cannot reach it.
    # Public traffic arrives through cloudflared, not through this port.
    ports:
      - "127.0.0.1:8081:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Token is read from .env (git-ignored) and never baked into an image.
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  study-data:
