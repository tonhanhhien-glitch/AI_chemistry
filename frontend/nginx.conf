# Trust the external protocol Cloudflare Tunnel reports, so the backend sees
# "https" for public traffic. Falls back to the scheme nginx actually served
# when the header is absent, which is the case for direct 127.0.0.1:8080 use.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  # Frontend liveness probe: Docker healthcheck and check-selfhost.sh.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Single-origin API proxy. proxy_pass carries no URI path component, so the
  # original request URI is forwarded verbatim:
  #   /api/v1/health  ->  backend:8000/api/v1/health
  # Adding a trailing slash here would strip the /api/ prefix and break routing.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # index.html must never be cached, or a client pins a stale asset manifest
  # and requests hashed bundles that no longer exist after a rebuild.
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Vite emits content-hashed filenames, so these are safe to cache immutably.
  location ~* \.(?:js|css|svg|png|jpe?g|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Refuse dotfiles that might end up in the web root (.env, .git, ...).
  location ~ /\. {
    deny all;
  }

  # React Router: unknown paths fall through to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
